[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-remote-mcp"
version = "0.1.0"
description = "Unreal Engine Remote Control API 用 MCP stdio サーバ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
]

[project.scripts]
ue-remote-mcp = "ue_remote.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ue_remote*"]
